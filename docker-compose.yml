services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Set to "false" to disable new account sign-up (existing logins still work).
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # Optional S3 storage backend — leave unset to use local disk only.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Optional SMB/network share — leave unset to disable.
      SMB_HOST: ${SMB_HOST:-}
      SMB_SHARE: ${SMB_SHARE:-}
      SMB_USERNAME: ${SMB_USERNAME:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-WORKGROUP}
      SMB_PORT: ${SMB_PORT:-445}
      SMB_CACHE_MAX_MB: ${SMB_CACHE_MAX_MB:-10240}
    volumes:
      - wavlo_db:/app/db
      - wavlo_uploads:/app/uploads
      - wavlo_smb_cache:/app/smb-cache

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  wavlo_db:
  wavlo_uploads:
  wavlo_smb_cache:
